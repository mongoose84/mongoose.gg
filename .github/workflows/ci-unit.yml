name: Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/ci-unit.yml'
  push:
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/ci-unit.yml'
  workflow_dispatch:

jobs:
  client-unit-tests:
    name: Client Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  server-unit-tests:
    name: Server Unit Tests (xUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: server
        run: dotnet restore mongoose.sln

      - name: Run unit tests
        working-directory: server
        run: dotnet test mongoose.sln --configuration Release --logger "trx;LogFileName=test-results.trx"
