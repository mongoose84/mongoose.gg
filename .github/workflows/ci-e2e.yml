# .github/workflows/ci-e2e.yml
name: E2E Tests - Playwright

# -------------------------------------------------
# When to run - PR requirement and post-merge validation
# -------------------------------------------------
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger from the UI

# -------------------------------------------------
# Job definition
# -------------------------------------------------
jobs:
  e2e-tests:
    name: E2E Tests (Chromium + Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Backend configuration
      # Use Production environment to test real production code paths
      # Email verification is bypassed via Auth:AutoVerifyEmail config flag
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://localhost:5164

    steps:
      # -------------------------------------------------
      # Checkout code (full clone for Nerdbank.GitVersioning)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone required for Nerdbank.GitVersioning

      # -------------------------------------------------
      # Setup .NET for backend
      # -------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # -------------------------------------------------
      # Setup Node.js for frontend
      # -------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # -------------------------------------------------
      # Install client dependencies
      # -------------------------------------------------
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # -------------------------------------------------
      # Install Playwright browsers
      # -------------------------------------------------
      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium firefox

      # -------------------------------------------------
      # Create backend appsettings for E2E
      # -------------------------------------------------
      - name: Generate appsettings.Production.json
        working-directory: server/Mongoose.Api
        env:
          DB_CONN: ${{ secrets.DB_CONNECTIONSTRING_TEST }}
          RIOT_KEY: ${{ secrets.RIOT_API_KEY }}
          ENC_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
        run: |
          cat > appsettings.Production.json << APPSETTINGS_EOF
          {
            "Logging": {
              "LogLevel": {
                "Default": "Warning",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*",
            "ConnectionStrings": {
              "Database_production": "${DB_CONN}"
            },
            "Riot": {
              "ApiKey": "${RIOT_KEY}"
            },
            "Auth": {
              "CookieName": "mongoose-auth",
              "SessionTimeout": 30,
              "EnableMvpLogin": true,
              "AutoVerifyEmail": true
            },
            "Jobs": {
              "EnableMatchHistorySync": false
            },
            "RateLimiting": {
              "Enabled": false
            },
            "Security": {
              "EncryptionSecret": "${ENC_SECRET}"
            }
          }
          APPSETTINGS_EOF
          echo "Generated appsettings.Production.json:"
          cat appsettings.Production.json

      # -------------------------------------------------
      # Build and start backend
      # -------------------------------------------------
      - name: Build backend
        working-directory: server/Mongoose.Api
        run: dotnet build -c Release

      - name: Start backend server
        working-directory: server/Mongoose.Api
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5164
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
          Database_production: ${{ secrets.DB_CONNECTIONSTRING_TEST }}
          Riot__ApiKey: ${{ secrets.RIOT_API_KEY }}
          Auth__AutoVerifyEmail: 'true'
          Email__DevMode: 'true'
        run: |
          # Use --no-launch-profile to prevent launchSettings.json from overriding environment
          dotnet run -c Release --no-build --no-launch-profile &
          echo "Backend PID: $!"
          # Wait for backend to be ready
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -s http://localhost:5164/api/v2/diagnostics > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to start after 30 attempts. Exiting with error."
              exit 1
            fi
          done

      # -------------------------------------------------
      # Run E2E tests
      # -------------------------------------------------
      - name: Run Playwright tests
        working-directory: client
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5174

      # -------------------------------------------------
      # Upload test artifacts on failure
      # -------------------------------------------------
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7

