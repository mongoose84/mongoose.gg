# .github/workflows/deploy-api.yml
name: Server - ASP .NET API CI & Deploy

# -------------------------------------------------
# When to run
# -------------------------------------------------
on:
  push:
    branches: [main]
    paths:
      - 'server/**'          # only trigger when API code changes
  workflow_dispatch:         # manual trigger from the UI

# -------------------------------------------------
# Job definition
# -------------------------------------------------
jobs:
  build-and-deploy:
    runs-on: windows-latest               # needed for win‑x86 runtime
    concurrency:
      group: server-prod-deploy
      cancel-in-progress: true
    env:
      # Folder where `dotnet publish` will drop the files
      PUBLISH_DIR: publish-output  
      Database_production: ${{ secrets.DB_CONNECTIONSTRING }}
      
    defaults:
      # Every `run:` step will start in the project folder
      run:
        working-directory: server

    steps:
      # -------------------------------------------------
      # Checkout the repo
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for versioning tools


      # (Removed early offline toggle to avoid leaving site offline if build fails)

      # -------------------------------------------------
      # Set up .NET SDK
      # -------------------------------------------------
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'          # matches TargetFramework net9.0

      # -------------------------------------------------
      # Restore NuGet packages (optional but clearer logs)
      # -------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore

      # -------------------------------------------------
      # Validate required secrets are set
      # -------------------------------------------------
      - name: Validate required secrets
        shell: pwsh
        run: |
          $missingSecrets = @()

          if ([string]::IsNullOrWhiteSpace("${{ secrets.DB_CONNECTIONSTRING }}")) {
            $missingSecrets += "DB_CONNECTIONSTRING"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.RIOT_API_KEY }}")) {
            $missingSecrets += "RIOT_API_KEY"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ENCRYPTION_SECRET }}")) {
            $missingSecrets += "ENCRYPTION_SECRET"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SMTP_HOST }}")) {
            $missingSecrets += "SMTP_HOST"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SMTP_USERNAME }}")) {
            $missingSecrets += "SMTP_USERNAME"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SMTP_PASSWORD }}")) {
            $missingSecrets += "SMTP_PASSWORD"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SMTP_FROM_EMAIL }}")) {
            $missingSecrets += "SMTP_FROM_EMAIL"
          }

          if ($missingSecrets.Count -gt 0) {
            Write-Error "❌ Missing required GitHub secrets: $($missingSecrets -join ', ')"
            Write-Error "Please add these secrets in: Settings → Secrets and variables → Actions"
            Write-Error "Required format:"
            Write-Error "  - DB_CONNECTIONSTRING: Server=host;Port=3306;Database=db;User=user;Password=pass;SslMode=Preferred;"
            Write-Error "  - RIOT_API_KEY: RGAPI-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
            Write-Error "  - ENCRYPTION_SECRET: Base64-encoded 32-byte key (use: openssl rand -base64 32)"
            Write-Error "  - SMTP_HOST: Your SMTP server hostname (e.g., websmtp.simply.com)"
            Write-Error "  - SMTP_USERNAME: Your SMTP username"
            Write-Error "  - SMTP_PASSWORD: Your SMTP password"
            Write-Error "  - SMTP_FROM_EMAIL: Sender email address (e.g., noreply@mongoose.gg)"
            exit 1
          }

          Write-Host "✅ All required secrets are configured"

      # -------------------------------------------------
      # Generate web.config with production secrets
      # This file configures IIS and sets secrets as process-level environment variables.
      # SECURITY NOTE: The publish output contains secrets and should be treated as sensitive.
      # The FTP deploy action does not cache/log file contents, but avoid storing artifacts.
      # For true runtime injection, consider Azure Key Vault or host-level env vars.
      # -------------------------------------------------
      - name: Generate web.config with secrets
        shell: pwsh
        run: |
          # XML-escape function to handle special characters in secrets
          # This prevents malformed XML if secrets contain &, <, >, ", or '
          function ConvertTo-XmlEscaped {
            param([string]$Value)
            if ([string]::IsNullOrEmpty($Value)) { return $Value }
            return [System.Security.SecurityElement]::Escape($Value)
          }

          # Escape all secret values for safe XML embedding
          $dbConnection = ConvertTo-XmlEscaped "${{ secrets.DB_CONNECTIONSTRING }}"
          $riotApiKey = ConvertTo-XmlEscaped "${{ secrets.RIOT_API_KEY }}"
          $encryptionSecret = ConvertTo-XmlEscaped "${{ secrets.ENCRYPTION_SECRET }}"
          $smtpHost = ConvertTo-XmlEscaped "${{ secrets.SMTP_HOST }}"
          $smtpUsername = ConvertTo-XmlEscaped "${{ secrets.SMTP_USERNAME }}"
          $smtpPassword = ConvertTo-XmlEscaped "${{ secrets.SMTP_PASSWORD }}"
          $smtpFromEmail = ConvertTo-XmlEscaped "${{ secrets.SMTP_FROM_EMAIL }}"

          $webConfig = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="aspNetCore"
                     path="*"
                     verb="*"
                     modules="AspNetCoreModule"
                     resourceType="Unspecified" />
              </handlers>

              <aspNetCore processPath=".\RiotProxy.exe"
                      arguments=""
                      stdoutLogEnabled="true"
                      stdoutLogFile=".\logs\stdout"
                      hostingModel="OutOfProcess">
                <environmentVariables>
                  <!-- ASP.NET Core Environment -->
                  <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />

                  <!-- Database Configuration -->
                  <environmentVariable name="ConnectionStrings__Database_production" value="$dbConnection" />

                  <!-- Riot API Configuration -->
                  <environmentVariable name="Riot__ApiKey" value="$riotApiKey" />

                  <!-- Authentication Configuration -->
                  <environmentVariable name="Auth__CookieName" value="pulse-auth" />
                  <environmentVariable name="Auth__SessionTimeout" value="43200" />
                  <environmentVariable name="Auth__EnableMvpLogin" value="true" />

                  <!-- Background Jobs Configuration -->
                  <environmentVariable name="Jobs__EnableMatchHistorySync" value="true" />

                  <!-- Security Configuration -->
                  <environmentVariable name="Security__EncryptionSecret" value="$encryptionSecret" />

                  <!-- Email Configuration -->
                  <environmentVariable name="Email__DevMode" value="false" />
                  <environmentVariable name="Email__SmtpHost" value="$smtpHost" />
                  <environmentVariable name="Email__SmtpPort" value="587" />
                  <environmentVariable name="Email__SmtpUsername" value="$smtpUsername" />
                  <environmentVariable name="Email__SmtpPassword" value="$smtpPassword" />
                  <environmentVariable name="Email__FromEmail" value="$smtpFromEmail" />
                  <environmentVariable name="Email__FromName" value="Mongoose.gg" />

                  <!-- Logging Configuration -->
                  <environmentVariable name="Logging__LogLevel__Default" value="Warning" />
                  <environmentVariable name="Logging__LogLevel__Microsoft.AspNetCore" value="Warning" />
                </environmentVariables>
              </aspNetCore>

              <!-- Ensure CORS headers from ASP.NET Core are passed through -->
              <httpProtocol>
                <customHeaders>
                  <remove name="X-Powered-By" />
                </customHeaders>
              </httpProtocol>
            </system.webServer>
          </configuration>
          "@

          Set-Content -Path "web.config" -Value $webConfig -Encoding UTF8

          # Validate the generated XML is well-formed
          try {
            [xml]$xmlDoc = Get-Content -Path "web.config" -Raw
            Write-Host "✅ web.config generated and validated as well-formed XML"
          } catch {
            Write-Error "❌ Generated web.config is not valid XML: $_"
            exit 1
          }

          Write-Host "✅ web.config generated with production secrets (XML-escaped and validated)"

      # -------------------------------------------------
      # Run server unit tests (including auth hardening)
      # -------------------------------------------------
      - name: Run tests
        run: dotnet test ../mongoose.sln --configuration Release --logger "trx;LogFileName=test-results.trx"

      # -------------------------------------------------
      # Publish a **self‑contained** Windows‑x86 binary
      # -------------------------------------------------
      - name: Publish (self-contained)
        run: |
          dotnet publish -c Release -r win-x86 --self-contained=true  -o ./${{ env.PUBLISH_DIR }}

      # -------------------------------------------------
      # Copy web.config to publish output (overwrite the default one)
      # This file contains IIS configuration and production secrets as env vars
      # -------------------------------------------------
      - name: Copy web.config to publish output
        shell: pwsh
        run: |
          $sourceFile = "./web.config"
          $targetFile = "./${{ env.PUBLISH_DIR }}/web.config"

          if (-not (Test-Path $sourceFile)) {
            Write-Error "❌ web.config not found at $sourceFile"
            exit 1
          }

          Write-Host "Source file size: $((Get-Item $sourceFile).Length) bytes"

          # Overwrite the default web.config generated by dotnet publish
          Copy-Item -Path $sourceFile -Destination $targetFile -Force
          Write-Host "✅ web.config with secrets copied to publish output (overwrote default)"

          # Verify the file was copied
          if (-not (Test-Path $targetFile)) {
            Write-Error "❌ Failed to copy web.config to publish output"
            exit 1
          }

          Write-Host "Target file size: $((Get-Item $targetFile).Length) bytes"
          Write-Host "✅ Verified: web.config exists in publish output"

          # Show structure without exposing secrets (count environment variables)
          $content = Get-Content $targetFile -Raw
          $envVarCount = ([regex]::Matches($content, '<environmentVariable')).Count
          Write-Host "web.config contains $envVarCount environment variable(s)"

      # -------------------------------------------------
      # Verify publish output exists and show its contents
      # -------------------------------------------------
      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "./${{ env.PUBLISH_DIR }}")) {
            Write-Error "Publish output folder './${{ env.PUBLISH_DIR }}' not found"
            exit 1
          }
          Write-Host "=== Files that will be uploaded ==="
          Get-ChildItem -Recurse "./${{ env.PUBLISH_DIR }}"

          # Verify web.config is present with secrets
          $webConfigPath = "./${{ env.PUBLISH_DIR }}/web.config"
          if (Test-Path $webConfigPath) {
            Write-Host "✅ VERIFIED: web.config is present in publish output"
            # Verify it contains our environment variables (not the default one)
            $content = Get-Content $webConfigPath -Raw
            if ($content -match 'ConnectionStrings__Database_production') {
              Write-Host "✅ VERIFIED: web.config contains production secrets"
            } else {
              Write-Error "❌ CRITICAL: web.config does not contain production secrets - may be using default"
              exit 1
            }
          } else {
            Write-Error "❌ CRITICAL: web.config is MISSING from publish output"
            exit 1
          }

      # -------------------------------------------------
      # Enter maintenance mode right before deploy (idempotent, with retries)
      # -------------------------------------------------
      - name: Bring site offline (upload app_offline.htm)
        id: bring-offline
        shell: pwsh
        run: |
          $maxAttempts = 3
          $remoteBase = "ftp://${{ secrets.FTP_HOSTNAME }}/${{ secrets.FTP_API_PATH }}"
          $remoteOffline = "$remoteBase/app_offline.htm"
          $localOffline = "./CI-Support/app_offline.htm"

          # If the site is already offline, do not fail—just skip the upload
          $alreadyOffline = $false
          curl -s --ssl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" `
            "$remoteOffline" > $null 2>&1
          if ($LASTEXITCODE -eq 0) { $alreadyOffline = $true }

          if ($alreadyOffline) {
            Write-Host "⚠️ app_offline.htm already present at root; skipping upload."
          }
          else {
            for ($i = 1; $i -le $maxAttempts; $i++) {
              Write-Host "Attempt ${i}: Uploading app_offline.htm to remote root"
              curl -v --ssl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" `
                -T $localOffline `
                "$remoteOffline"
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Maintenance mode enabled"
                "site_offline=true" >> $env:GITHUB_OUTPUT
                break
              }
              elseif ($i -eq $maxAttempts) {
                Write-Error "❌ Failed to enable maintenance mode after $maxAttempts attempts"
                exit 1
              }
              else {
                $delay = 5 * $i
                Write-Warning "Upload failed, retrying in $delay seconds..."
                Start-Sleep -Seconds $delay
              }
            }
          }
          # If already offline, also set the output so we bring it back online
          if ($alreadyOffline) {
            "site_offline=true" >> $env:GITHUB_OUTPUT
          }

          # Wait for IIS to detect app_offline.htm and shut down the worker process
          # IIS typically checks for this file every few seconds, but the worker process
          # may take additional time to release file locks on DLLs
          Write-Host "⏳ Waiting 15 seconds for IIS to shut down the application..."
          Start-Sleep -Seconds 15
          Write-Host "✅ Proceeding with deployment"

      # -------------------------------------------------
      # Deploy new files via FTPS (publish folder only)
      # -------------------------------------------------
      - name: Deploy new files to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Point to the SAME folder we just verified
          local-dir: ./server/${{ env.PUBLISH_DIR }}/
          # NOTE: The exclusion patterns below may be redundant. RiotProxy.csproj already
          # excludes RiotProxy.Tests content via Compile Remove, EmbeddedResource Remove,
          # and None Remove directives. Since the tests project is separate and should not
          # be included in the publish output by dotnet publish, these FTP patterns are
          # likely unnecessary. Consider removing if verification confirms test files are
          # not present in the publish folder.
          exclude: |
            RiotProxy.Tests/**
            **/RiotProxy.Tests/**
            app_offline.htm
          server-dir: ${{ secrets.FTP_API_PATH }}/
          # optional safety flags
          # dry-run: false
          # timeout: 30

      # --------------------------------------------------------------
      # Bring site back online by deleting app_offline.htm
      # Note: The FTP deploy step above already deployed the new files,
      # so we just need to delete app_offline.htm to bring the site online
      # --------------------------------------------------------------
      - name: Bring site back online (delete app_offline.htm)
        if: ${{ always() && steps.bring-offline.outputs.site_offline == 'true' }}
        shell: pwsh
        run: |
          $maxAttempts = 3
          $remoteBase = "ftp://${{ secrets.FTP_HOSTNAME }}/${{ secrets.FTP_API_PATH }}"
          $deleteSucceeded = $false

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Attempt ${i}: Deleting app_offline.htm to bring site back online"

            # Run curl and capture exit code
            curl -v --ssl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" `
              "$remoteBase" `
              -Q "DELE ${{ secrets.FTP_API_PATH }}/app_offline.htm" 2>&1 | Out-Null

            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              Write-Host "✅ Maintenance mode disabled (app_offline.htm deleted)"
              $deleteSucceeded = $true
              break
            }
            elseif ($exitCode -eq 21 -or $exitCode -eq 78) {
              # Exit codes 21 or 78 typically mean file not found - site is already online
              Write-Host "✅ app_offline.htm not found; site is already online (exit code: $exitCode)"
              $deleteSucceeded = $true
              break
            }
            elseif ($i -eq $maxAttempts) {
              Write-Warning "⚠️ Failed to delete app_offline.htm after $maxAttempts attempts (exit code: $exitCode); site may remain offline"
              break
            }
            else {
              $delay = 5 * $i
              Write-Warning "Delete failed with exit code $exitCode, retrying in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
          }

          if (-not $deleteSucceeded) {
            Write-Error "❌ Maintenance mode could not be disabled; pipeline failing to alert operators"
            exit 1
          }

          Write-Host "✅ Site is now online"
          exit 0

